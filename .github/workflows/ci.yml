name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install web dependencies (locked)
        run: npm ci
      - name: Install core dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/core-api/requirements-lock.txt
          python -m pip install --no-deps -e "services\core-api[dev]"
      - name: Test web
        run: npm run test:web
      - name: Test core
        run: python -m pytest services/core-api/tests -q
      - name: Test database migrations
        run: python -m pytest services/core-api/tests/test_migrations.py -q
      - name: Build web
        run: npm run build --workspace apps/desktop
      - name: Validate Tauri Cargo metadata
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps
      - name: Cargo check (Rust shell compiles)
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Cargo test (Rust unit tests)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build core sidecar (PyInstaller onedir)
        run: ./scripts/build-core.ps1
      - name: Smoke core sidecar exe (health + auth + migrations)
        run: ./scripts/smoke-core-exe.ps1
      - name: Desktop shell build (tauri build, full Rust link)
        run: npm run tauri:build --workspace apps/desktop
