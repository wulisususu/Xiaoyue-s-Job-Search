name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install web dependencies (locked)
        run: npm ci
      - name: Install core dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/core-api/requirements-lock.txt
          python -m pip install --no-deps -e "services\core-api[dev]"
      - name: Test web
        run: npm run test:web
      - name: Test core
        run: python -m pytest services/core-api/tests -q
      - name: DB migration test (fresh DB -> latest)
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          os.environ["XIAOYUE_DATA_DIR"] = tempfile.mkdtemp()
          import sys
          sys.path.insert(0, "services/core-api")
          from app.config import get_settings
          from app.db import init_db, get_engine
          from sqlalchemy import inspect
          settings = get_settings()
          init_db(settings)
          engine = get_engine(settings)
          tables = inspect(engine).get_table_names()
          assert "alembic_version" in tables, tables
          assert "job_sources" in tables, tables
          cols = {c["name"] for c in inspect(engine).get_columns("job_sources")}
          assert {"record_hash", "status"} <= cols, cols
          engine.dispose()
          init_db(settings)  # second run must be a no-op upgrade
          print("migration test OK")
          PY
      - name: DB migration test (pre-lifecycle DB -> latest)
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          data_dir = tempfile.mkdtemp()
          os.environ["XIAOYUE_DATA_DIR"] = data_dir
          import sys
          sys.path.insert(0, "services/core-api")
          from sqlalchemy import create_engine, inspect, text
          from app.models import Base
          # Simulate a database created before the job-source lifecycle columns.
          engine = create_engine(f"sqlite:///{Path(data_dir) / 'xiaoyue.db'}")
          Base.metadata.create_all(engine)
          with engine.begin() as conn:
              conn.execute(text("ALTER TABLE job_sources DROP COLUMN record_hash"))
              conn.execute(text("ALTER TABLE job_sources DROP COLUMN status"))
          engine.dispose()
          del os.environ["XIAOYUE_DATA_DIR"]
          os.environ["XIAOYUE_DATA_DIR"] = data_dir
          from app.config import get_settings
          from app.db import init_db
          init_db(get_settings())
          engine = create_engine(f"sqlite:///{Path(data_dir) / 'xiaoyue.db'}")
          cols = {c["name"] for c in inspect(engine).get_columns("job_sources")}
          assert {"record_hash", "status"} <= cols, cols
          engine.dispose()
          print("old-DB upgrade OK")
          PY
      - name: Build web
        run: npm run build --workspace apps/desktop
      - name: Validate Tauri Cargo metadata
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps
